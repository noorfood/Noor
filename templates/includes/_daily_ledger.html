<section class="panel" style="margin-top:20px"><div class="panel-header"><h2>Daily ledger ({{ today|default:"Today" }})</h2></div>
{% if today_activities %}<div class="table-scroll"><table><thead><tr><th>Time</th><th>Activity</th><th>Description</th></tr></thead><tbody>
{% for log in today_activities %}<tr><td>{{ log.timestamp|date:"h:i A" }}</td><td><span class="status-pill">{{ log.get_action_display }}</span></td><td>{{ log.description }}</td></tr>{% endfor %}
</tbody></table></div>
{% else %}<p class="simple-empty">No activities recorded yet.</p>{% endif %}
</section>
